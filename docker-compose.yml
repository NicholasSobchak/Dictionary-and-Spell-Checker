services:
  backend:
    image: ${DOCKER_IMAGE:-nicksobchak/quickquill}
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./dictionary.db:/app/dictionary.db:ro
    expose:
      - "8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_APPLICATION_JSON={"quickquill":{"dictionary-path":"/app/dictionary.db"}}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/api/word/test || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped
  #   command:
  #     redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
  #   volumes:
  #     - redis_data:/data

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/dist/browser:/usr/share/nginx/html:ro
      - nginx_data:/var/cache/nginx
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  nginx_data:
