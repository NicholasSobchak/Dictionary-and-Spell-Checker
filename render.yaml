# Render Blueprint for QuickQuill.
#
# Deploy: create a new Blueprint in the Render dashboard pointing at this
# repo; Render provisions the managed Postgres and the two web services below
# and rebuilds them on push to main.
#
# Notes:
#   * Each service builds a dedicated, self-contained Dockerfile (.backend /
#     .frontend). Render Blueprints cannot select a stage of a multi-stage
#     Dockerfile, so the stages are inlined per service here.
#   * Backend + frontend are separate services. Render auto-provisions HTTPS;
#     the frontend nginx speaks plain HTTP:80 to the edge.
#   * Render defaults the expected HTTP port to 10000 (the PORT env var) and
#     probes the container for a listener there. When the app binds a different
#     port instead, the deploy log shows "Detected a new open port HTTP:xxxx"
#     and the deploy stalls instead of going Live. Each service below therefore
#     overrides PORT to match the port its image actually listens on (8080 for
#     the backend JAR, 80 for the frontend nginx).
#   * dictionary.db is committed to the repo and baked into the backend image.
#     Free-tier web services have no persistent disk, so the dictionary is
#     updated by committing a new dictionary.db and redeploying.
#   * Env values come from the managed database via fromDatabase properties
#     below (DB_HOST/DB_PORT/DB_NAME/DB_USERNAME/DB_PASSWORD); DB_SSLMODE=require
#     because Render Postgres requires TLS. The JDBC URL is assembled in
#     application.properties, and any leftover postgres:// DB_URL connection
#     string is normalized to jdbc:postgresql://host:5432/db at startup.

services:
  - type: web
    name: quickquill-backend
    runtime: docker
    repo: https://github.com/nickczak/QuickQuill-Dictionary-SpellChecker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    plan: free
    # No healthCheckPath: the app takes ~90s to start serving on a cold free
    # instance, and an HTTP health check trailing that window keeps failing
    # and getting the deploy stuck/suspended. Without it Render marks the
    # service Live as soon as the port accepts connections.
    envVars:
      # Spring Boot binds server.port=8080; align Render's expected port so it
      # routes traffic there instead of the default 10000 (which otherwise logs
      # "Detected a new open port HTTP:8080" and stalls the deploy).
      - key: PORT
        value: "8080"
      - key: QUICKQUILL_DICTIONARY_PATH
        value: /app/dictionary.db
      - key: DB_SSLMODE
        value: require
      # Render's fromDatabase connectionString is a non-JDBC postgres:// URL,
      # so the JDBC URL is assembled in application.properties from these
      # parts instead.
      - key: DB_HOST
        fromDatabase:
          name: quickquill-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: quickquill-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: quickquill-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: quickquill-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: quickquill-db
          property: password

  - type: web
    name: quickquill-frontend
    runtime: docker
    repo: https://github.com/nickczak/QuickQuill-Dictionary-SpellChecker
    dockerfilePath: ./Dockerfile.frontend
    dockerContext: .
    plan: free
    envVars:
      # nginx render.conf listens on plain HTTP:80; align Render's expected
      # port so it routes traffic there instead of the default 10000.
      - key: PORT
        value: "80"
      - key: BACKEND_URL
        value: http://quickquill-backend.onrender.com

databases:
  - name: quickquill-db
    plan: free