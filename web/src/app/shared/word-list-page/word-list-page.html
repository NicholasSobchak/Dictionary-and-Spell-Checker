<app-page-shell [title]="title()">
  <div shellButtons>
    <button type="button" class="back-button" routerLink="/">← Back to Dictionary</button>
    <button type="button" class="clear-history-button" (click)="clearAll()">Clear All</button>
  </div>
  <div class="row">
    <input
      class="filter-input"
      [value]="filterText()"
      (input)="onFilterInput($event)"
      [placeholder]="placeholder()"
      autocomplete="off"
    />
  </div>
  <div class="word-list-grid">
    @for (word of filteredWords(); track word) {
      <button type="button" class="chip word-list-chip" (click)="searchWord(word)">
        {{ word }}
      </button>
    }
  </div>
  @if (!filteredWords().length) {
    <div class="word-list-empty">{{ emptyMessage() }}</div>
  }
</app-page-shell>
