# QuickQuill nginx config for Render. TLS is terminated at Render's edge,
# so this server only listens on plain HTTP port 80. The /api/ prefix is
# proxied to the backend service; Render injects BACKEND_URL (or
# RENDER_INTERNAL_SERVICE_URL) via envsubst at image start.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types
      text/plain
      text/css
      application/json
      application/javascript
      image/svg+xml
      font/woff2;

    location /api/ {
        proxy_pass ${BACKEND_URL}/api/;
        # Render routes onrender.com traffic to a service by Host header, so
        # send the BACKEND host ($proxy_host) upstream, not the frontend's
        # $host — otherwise the proxy request loops back into this service.
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # The free-tier backend sleeps after inactivity and takes ~90s to cold
        # start; keep the upstream request alive through that instead of 502ing.
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}