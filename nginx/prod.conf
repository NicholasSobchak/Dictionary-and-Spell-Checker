# QuickQuill production nginx config (VPS / systemd setup).
# @ROOT@, @SSL_CERT@ and @SSL_CERT_KEY@ are substituted by deploy.yml from the
# currently active nginx config so paths are never guessed.
server {
    listen 80;
    server_name quickquill.ink www.quickquill.ink;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name quickquill.ink www.quickquill.ink;

    ssl_certificate @SSL_CERT@;
    ssl_certificate_key @SSL_CERT_KEY@;

    root @ROOT@;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
