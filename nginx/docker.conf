# QuickQuill production nginx config, baked into the frontend Docker image.
# The stack runs with network_mode: host, so the backend is reached via
# 127.0.0.1:8080 (not a compose service name). Certificates and the certbot
# webroot are bind-mounted from the host by compose.prod.yml.

server {
    listen 80;
    server_name quickquill.ink www.quickquill.ink;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name quickquill.ink www.quickquill.ink;

    ssl_certificate /etc/letsencrypt/live/quickquill.ink/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quickquill.ink/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
