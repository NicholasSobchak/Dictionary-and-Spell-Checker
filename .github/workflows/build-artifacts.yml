name: Build artifacts

on:
  workflow_call:
    inputs:
      run-cpp-tests:
        description: Build and run the C++ test suite
        type: boolean
        default: false
      cpp-format-check:
        description: Run the clang-format check
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-engine:
    name: Build C++ engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install clang-format for the style check
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-17

      - name: Check C++ formatting
        if: ${{ inputs.cpp-format-check }}
        run: find engine/src engine/include engine/tests engine/utils -type f \( -name "*.cpp" -o -name "*.h" \) -exec clang-format-17 --dry-run --Werror {} +

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-glibc231-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-glibc231-

      - name: Cache vcpkg tool
        uses: actions/cache@v4
        with:
          path: vcpkg
          key: vcpkg-tool-glibc231-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-tool-glibc231-

      - name: Build engine in Ubuntu 20.04 container (glibc 2.31)
        run: |
          # Build inside ubuntu:20.04 (glibc 2.31) so the .so loads on the
          # VPS (built with the ubuntu-latest glibc 2.39 it failed with
          # "GLIBC_2.38 not found"). The oldest glibc we require is then 2.28.
          mkdir -p "$HOME/.cache/vcpkg"
          docker run --rm \
            -e RUN_TESTS=${{ inputs.run-cpp-tests }} \
            -v "$PWD":/workspace -w /workspace \
            -v "$HOME/.cache/vcpkg":/root/.cache/vcpkg \
            ubuntu:20.04 \
            bash -euxo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -o Acquire::Retries=5 -o Acquire::http::Timeout=120 -o Acquire::https::Timeout=120 || apt-get update -o Acquire::Retries=5
              apt-get install -y --fix-missing build-essential git curl unzip zip pkg-config ca-certificates python3-pip
              pip3 install cmake ninja
              if [ ! -f vcpkg/vcpkg ]; then
                git clone https://github.com/microsoft/vcpkg.git vcpkg
                git -C vcpkg checkout 2025.04.09
                ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
              fi
              cmake -B build -S . -G Ninja -DCMAKE_TOOLCHAIN_FILE=/workspace/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-linux
              cmake --build build --target quickquill_engine
              if [ "$RUN_TESTS" = "true" ]; then
                cmake --build build --target runTests
                ctest --test-dir build --output-on-failure
              fi
            '

      - name: Upload engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine
          path: build/engine/src/libquickquill_engine.so
          if-no-files-found: error

  build-backend:
    name: Build Spring Boot backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build backend JAR
        run: |
          ./gradlew bootJar || { echo "First build attempt failed (likely Maven Central 403), retrying..."; sleep 30; ./gradlew bootJar; }
        working-directory: studio/

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend
          path: studio/build/libs/*.jar
          if-no-files-found: error

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        run: |
          cd web
          npm ci
          npm run build
          npm run test:ci
          npm run lint
          npm run format:check

      - name: Verify frontend output
        run: |
          test -f web/dist/browser/index.html || { echo "ERROR: index.html not found"; exit 1; }

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: web/dist/browser
          if-no-files-found: error
