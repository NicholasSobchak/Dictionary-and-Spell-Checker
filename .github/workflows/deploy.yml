name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-artifacts.yml
    with:
      run-cpp-tests: false

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download engine artifact
        uses: actions/download-artifact@v4
        with:
          name: engine
          path: artifacts-engine

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend
          path: artifacts-backend

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend
          path: artifacts-frontend

      - name: Stage release tarball
        # Secrets are injected through the environment (env:) rather than
        # interpolated into the shell script, so values containing $, ", or
        # backticks can't break or inject into the command. GitHub masks the
        # values in logs either way.
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          # upload-artifact v4 flattens paths to the artifact root, so each
          # artifact's contents arrive loose in its own download directory.
          # Locate files by name and copy the frontend contents wholesale.
          SO=$(find artifacts-engine -type f -name 'libquickquill_engine.so' 2>/dev/null | head -n1 || true)
          BOOT_JAR=$(find artifacts-backend -type f -name '*.jar' ! -name '*-plain.jar' 2>/dev/null | head -n1 || true)
          INDEX_HTML=$(find artifacts-frontend -type f -name 'index.html' 2>/dev/null | head -n1 || true)
          test -n "$SO" || { echo "ERROR: libquickquill_engine.so not found"; exit 1; }
          test -n "$BOOT_JAR" || { echo "ERROR: boot JAR not found"; exit 1; }
          test -n "$INDEX_HTML" || { echo "ERROR: frontend index.html not found"; exit 1; }
          mkdir -p release/browser
          cp -r artifacts-frontend/. release/browser/
          cp "$SO" release/libquickquill_engine.so
          cp "$BOOT_JAR" release/quickquill-backend.jar
          cp nginx/prod.conf release/
          # DB credentials come from GitHub repo secrets via the env block
          # above (never committed). The VPS systemd drop-in is built from
          # this file by deploy_prod.sh.
          test -n "$DB_URL" || { echo "ERROR: DB_URL secret not set"; exit 1; }
          test -n "$DB_USERNAME" || { echo "ERROR: DB_USERNAME secret not set"; exit 1; }
          test -n "$DB_PASSWORD" || { echo "ERROR: DB_PASSWORD secret not set"; exit 1; }
          printf '[Service]\nEnvironment=DB_URL=%s\nEnvironment=DB_USERNAME=%s\nEnvironment=DB_PASSWORD=%s\n' \
            "$DB_URL" "$DB_USERNAME" "$DB_PASSWORD" \
            > release/vps-backend.env
          test -f release/quickquill-backend.jar || { echo "ERROR: JAR missing"; exit 1; }
          test -f release/libquickquill_engine.so || { echo "ERROR: .so missing"; exit 1; }
          test -f release/browser/index.html || { echo "ERROR: index.html missing"; exit 1; }
          tar -czf release.tar.gz -C release .

      - name: Upload release and deploy script to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # import_extras.py removed from the upload: the extras import is
          # commented out in deploy_prod.sh (extras are already seeded on prod).
          source: "release.tar.gz,scripts/deploy_prod.sh"
          target: /var/www/quickquill
          strip_components: 0

      - name: Run production deploy script
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 30s
          command_timeout: 30m
          script: |
            set -e
            bash /var/www/quickquill/scripts/deploy_prod.sh
