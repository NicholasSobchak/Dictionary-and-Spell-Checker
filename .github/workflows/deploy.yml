name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-artifacts.yml
    with:
      run-cpp-tests: false

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download engine artifact
        uses: actions/download-artifact@v4
        with:
          name: engine
          path: artifacts

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend
          path: artifacts

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend
          path: artifacts

      - name: Stage release tarball
        run: |
          mkdir -p release/browser
          cp artifacts/build/engine/src/libquickquill_engine.so release/libquickquill_engine.so
          cp artifacts/studio/build/libs/*.jar release/quickquill-backend.jar
          cp -r artifacts/web/dist/browser/. release/browser/
          cp deploy/nginx-quickquill-vps.conf release/
          cp deploy/quickquill-backend.env release/
          test -f release/quickquill-backend.jar || { echo "ERROR: JAR missing"; exit 1; }
          test -f release/libquickquill_engine.so || { echo "ERROR: .so missing"; exit 1; }
          test -f release/browser/index.html || { echo "ERROR: index.html missing"; exit 1; }
          tar -czf release.tar.gz -C release .

      - name: Upload release and deploy script to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "release.tar.gz,scripts/deploy_prod.sh"
          target: /var/www/quickquill
          strip_components: 0

      - name: Run production deploy script
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 30s
          command_timeout: 30m
          script: |
            set -e
            bash /var/www/quickquill/scripts/deploy_prod.sh
