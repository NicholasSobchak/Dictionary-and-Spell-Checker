name: Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # Build C++ engine .so
      - name: Install C++ Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build build-essential

      - name: Bootstrap Vcpkg
        run: |
          if [ ! -f vcpkg/vcpkg ]; then
            git clone --depth=1 https://github.com/microsoft/vcpkg.git
            ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          fi

      - name: Configure & Build C++ Engine
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=x64-linux
          cmake --build build --target quickquill_engine

      # Build Spring Boot JAR
      - name: Setup Java 22
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '22'

      - name: Build Spring Boot JAR
        run: ./gradlew bootJar
        working-directory: studio/

      # Build Frontend
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build Frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Verify build output
        run: |
          ls -la web/dist/browser/
          test -f web/dist/browser/index.html || { echo "ERROR: index.html not found"; exit 1; }

      # Deploy to VPS
      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "studio/build/libs/*.jar,build/engine/src/libquickquill_engine.so,web/dist/browser"
          target: /var/www/quickquill
          strip_components: 0

      - name: Restart services
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/quickquill
            sudo systemctl restart quickquill-backend
            sudo systemctl restart nginx
            echo "Deploy complete"
