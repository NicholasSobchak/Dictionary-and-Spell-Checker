name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-artifacts.yml
    with:
      run-cpp-tests: false

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download engine artifact
        uses: actions/download-artifact@v4
        with:
          name: engine
          path: artifacts

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend
          path: artifacts

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend
          path: artifacts

      - name: Stage release tarball
        run: |
          # Locate artifacts by name: upload-artifact flattens wildcard
          # paths after the first wildcard, so don't assume the layout.
          SO=$(find artifacts -type f -name 'libquickquill_engine.so' 2>/dev/null | head -n1 || true)
          BOOT_JAR=$(find artifacts -type f -name '*.jar' ! -name '*-plain.jar' 2>/dev/null | head -n1 || true)
          BROWSER=$(find artifacts -type d -name browser 2>/dev/null | head -n1 || true)
          test -n "$SO" || { echo "ERROR: libquickquill_engine.so not found"; exit 1; }
          test -n "$BOOT_JAR" || { echo "ERROR: boot JAR not found"; exit 1; }
          test -n "$BROWSER" || { echo "ERROR: browser build not found"; exit 1; }
          mkdir -p release/browser
          cp "$SO" release/libquickquill_engine.so
          cp "$BOOT_JAR" release/quickquill-backend.jar
          cp -r "$BROWSER"/. release/browser/
          cp deploy/nginx-quickquill-vps.conf release/
          cp deploy/quickquill-backend.env release/
          test -f release/quickquill-backend.jar || { echo "ERROR: JAR missing"; exit 1; }
          test -f release/libquickquill_engine.so || { echo "ERROR: .so missing"; exit 1; }
          test -f release/browser/index.html || { echo "ERROR: index.html missing"; exit 1; }
          tar -czf release.tar.gz -C release .

      - name: Upload release and deploy script to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "release.tar.gz,scripts/deploy_prod.sh"
          target: /var/www/quickquill
          strip_components: 0

      - name: Run production deploy script
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 30s
          command_timeout: 30m
          script: |
            set -e
            bash /var/www/quickquill/scripts/deploy_prod.sh
