spring.application.name=studio
server.port=8080
quickquill.dictionary-path=../dictionary.db
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/quickquill}
spring.datasource.username=${DB_USERNAME:quickquill}
spring.datasource.password=${DB_PASSWORD:quickquill}
# Connect to the localhost database without TLS. The backend uses host
# networking on the VPS, so the connection stays on the host loopback where
# SSL adds no security; requiring it breaks startup when PostgreSQL advertises
# SSL but the handshake fails (SSL error: Broken pipe).
spring.datasource.hikari.data-source-properties.sslmode=disable
